<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Tarjeta de Presentación AR - Juan Daniel Madero</title>

    <!-- A-Frame y AR.js con soporte para seguimiento de imágenes naturales (NFT) -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

    <script>
        // Componente para controlar reproducción de video según la vista del marcador
        AFRAME.registerComponent('videohandler', {
            init: function () {
                var marker = this.el;
                this.vid = document.querySelector("#profile-video");

                // Reproduce solo cuando el marcador entra en escena
                marker.addEventListener('markerFound', function () {
                    if (this.vid) {
                        this.vid.play();
                    }
                }.bind(this));

                // Pausa y reinicia el video cuando se pierde de vista el marcador
                marker.addEventListener('markerLost', function() {
                    if (this.vid) {
                        this.vid.pause();
                        this.vid.currentTime = 0;
                    }
                }.bind(this));
            }
        });

        // Componente para manejar enlaces
        AFRAME.registerComponent('linkhandler', {
            schema: { url: { type: 'string', default: '#' } },
            init: function () {
                var url = this.data.url;
                this.el.addEventListener('click', function () {
                    if (url !== '#') {
                        window.open(url, '_blank');
                    }
                });
            }
        });

        window.addEventListener('DOMContentLoaded', function () {
            var startBtn = document.querySelector('#start-btn');
            var overlay = document.querySelector('#start-overlay');
            var vid = document.querySelector('#profile-video');

            startBtn.addEventListener('click', function () {
                if (vid) {
                    vid.muted = false; // Habilita el audio del video
                    vid.play().then(function() {
                        vid.pause();
                        vid.currentTime = 0;
                    }).catch(function(err) {
                        console.log("Error al activar audio:", err);
                    });
                }
                overlay.style.display = 'none'; // Oculta la pantalla de inicio
            });
        });
    </script>

    <style>
        body { margin: 0; overflow: hidden; }

        /* Capa superpuesta para autorizar el audio en móviles */
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #FFFFFF;
            font-family: sans-serif;
        }

        .ar-btn {
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: bold;
            background-color: #00E676;
            color: #1E1E1E;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 230, 118, 0.3);
        }

        .ar-instruction {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: #FFFFFF;
            font-family: sans-serif;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 0;
            z-index: 999;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <!-- Pantalla de inicio para desbloqueo de audio -->
    <div id="start-overlay">
        <p style="margin-bottom: 20px; text-align: center; padding: 0 20px;">
            Toca el botón para activar la experiencia con audio
        </p>
        <button id="start-btn" class="ar-btn">Iniciar Experiencia AR</button>
    </div>

    <div class="ar-instruction">Apunta la cámara a la imagen trasera de tu tarjeta</div>

    <a-scene 
        vr-mode-ui="enabled: false;"
        renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true;"
        embedded 
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

        <!-- Recursos (Video) -->
        <a-assets>
            <video 
                id="profile-video" 
                src="Presentacion.mp4" 
                preload="auto" 
                loop 
                crossorigin 
                webkit-playsinline 
                playsinline 
                muted>
            </video>
        </a-assets>

        <!-- Luces -->
        <a-entity light="type: ambient; intensity: 0.9"></a-entity>
        <a-entity light="type: directional; intensity: 0.4" position="1 2 1"></a-entity>

        <!-- MARCADOR NFT (ANÁLISIS DE LA IMAGEN TRASERA) -->
        <!-- 'url' apunta a los descriptores generados (ej. descriptors/tarjeta-trasera) -->
        <a-nft 
            type="nft" 
            url="descriptors/tarjeta-trasera" 
            smooth="true" 
            smoothCount="10" 
            smoothTolerance=".01" 
            smoothThreshold="5" 
            videohandler>

            <!-- Contenedor adaptado a la escala y origen de coordenadas NFT -->
            <a-entity position="50 150 -50" rotation="-90 0 0" scale="50 50 50">

                <a-plane 
                    width="3.2" 
                    height="2.2" 
                    color="#1E1E1E" 
                    material="opacity: 0.92; transparent: true;" 
                    position="0 0 0">
                </a-plane>

                <!-- 1. Video de Presentación -->
                <a-video 
                    src="#profile-video" 
                    position="-1.0 0.3 0.05" 
                    width="0.9" 
                    height="1.2">
                </a-video>

                <!-- 2. Información Textual -->
                <a-text 
                    value="JUAN DANIEL MADERO ESCOBEDO" 
                    color="#00E676" 
                    width="3.2" 
                    position="-0.4 0.7 0.05" 
                    wrap-count="22">
                </a-text>

                <a-text 
                    value="Futuro Ing. en Computacion" 
                    color="#F4F4F4" 
                    width="2.5" 
                    position="-0.4 0.45 0.05">
                </a-text>

                <a-text 
                    value="Tel: +52 492 419 4874" 
                    color="#B0BEC5" 
                    width="2.1" 
                    position="-0.4 0.2 0.05">
                </a-text>

                <a-text 
                    value="Email: 42200936@uaz.edu.mx" 
                    color="#B0BEC5" 
                    width="2.1" 
                    position="-0.4 -0.02 0.05">
                </a-text>

                <!-- 3. Botones Interactivos -->
                <a-plane 
                    class="clickable" 
                    linkhandler="url: https://www.linkedin.com" 
                    position="-0.75 -0.55 0.08" 
                    width="1.3" 
                    height="0.32" 
                    color="#0077B5">
                    <a-text value="LinkedIn / Portafolio" align="center" color="#FFFFFF" width="2.2" position="0 0 0.02"></a-text>
                </a-plane>

                <a-plane 
                    class="clickable" 
                    linkhandler="url: https://github.com" 
                    position="0.75 -0.55 0.08" 
                    width="1.3" 
                    height="0.32" 
                    color="#00E676">
                    <a-text value="+ Mas Informacion" align="center" color="#1E1E1E" width="2.2" position="0 0 0.02"></a-text>
                </a-plane>

            </a-entity>
        </a-nft>

        <!-- Cámara con Raycaster -->
        <a-entity camera raycaster="objects: .clickable" cursor="fuse: false; rayOrigin: mouse"></a-entity>

    </a-scene>
</body>
</html>
